---
name: CI

"on":
  push:
    branches:
      - "*"
  pull_request:
  schedule:
    - cron: 0 0 * * 0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/ruff-action@v3

      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check
  test:
    strategy:
      matrix:
        include:
          - netbox: v4.4
          - netbox: v4.5

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup Python 3.12
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Ensure playwright browsers are installed
        run: uv run playwright install --with-deps

      - name: Run uv build
        run: uv build

      - name: Run test_setup.sh
        run: ./tests/test_setup.sh
        env:
          NETBOX_CONTAINER_TAG: ${{ matrix.netbox }}

      # ORM/logic unit tests (netbox_kea/tests/) inside a NetBox container
      # against the compose postgres — the Django-dependent code the
      # framework-free engine tests can't reach. Also catches migration
      # drift. Mirrors the netbox-community plugin convention.
      - name: Run plugin unit tests + migration check
        working-directory: ./tests/docker/
        run: |
          docker compose run --rm netbox \
            /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py \
            makemigrations netbox_kea --check --dry-run
          docker compose run --rm netbox \
            /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py \
            test netbox_kea -v 2

      - name: Run pytest
        run: |
          uv run pytest --tracing=retain-on-failure -v

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces
          path: test-results/

      - name: Show Docker logs
        if: ${{ always() }}
        run: docker compose logs
        working-directory: ./tests/docker/
